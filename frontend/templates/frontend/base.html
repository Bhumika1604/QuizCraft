{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}QuizCraft{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
{% block extra_css %}{% endblock %}
</head>
<body>

<nav class="qc-navbar">
  <div class="container d-flex align-items-center justify-content-between">
    <a href="/" class="qc-brand"><i class="fa-solid fa-graduation-cap"></i> QuizCraft</a>
    <div class="qc-nav-links d-none d-lg-flex" id="qc-nav-links"></div>
    <div id="qc-nav-actions"></div>
    <button class="btn d-lg-none" id="qc-nav-toggle"><i class="fa-solid fa-bars"></i></button>
  </div>
  <div class="container d-lg-none" id="qc-nav-mobile" style="display:none;"></div>
</nav>

<div id="qc-toast-region"></div>

{% block content %}{% endblock %}

<footer class="qc-footer">
  <div class="container d-flex flex-wrap justify-content-between align-items-center">
    <div><i class="fa-solid fa-graduation-cap"></i> <strong class="text-white">QuizCraft</strong> — Adaptive Quiz Generator</div>
    <div class="d-flex gap-3">
      <a href="/about/">About</a>
      <a href="/features/">Features</a>
      <a href="/contact/">Contact</a>
    </div>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="{% static 'js/api.js' %}"></script>
<script src="{% static 'js/navbar.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
