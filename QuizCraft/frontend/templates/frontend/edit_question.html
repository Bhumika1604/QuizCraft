{% extends "frontend/base.html" %}
{% load static %}
{% block title %}Edit Question — QuizCraft{% endblock %}
{% block content %}
<section class="container py-5" style="max-width:720px;">
  <h2 class="section-title">Edit Question</h2>
  <p class="section-sub">Changes save directly to MongoDB.</p>

  <div id="loading-state"><div class="qc-spinner"></div><p class="qc-loading-text">Loading question...</p></div>

  <div class="qc-card" id="form-wrap" style="display:none;">
    <form id="question-form" novalidate>
      <div class="mb-3">
        <label class="qc-label">Subject</label>
        <select class="qc-input" id="subject" required></select>
        <div class="field-error" id="err-subject"></div>
      </div>
      <div class="mb-3">
        <label class="qc-label">Question Text</label>
        <textarea class="qc-input" id="question_text" rows="3"></textarea>
        <div class="field-error" id="err-question_text"></div>
      </div>
      <div class="row g-3 mb-1">
        <div class="col-md-6"><label class="qc-label">Option 1</label><input class="qc-input" id="opt0"></div>
        <div class="col-md-6"><label class="qc-label">Option 2</label><input class="qc-input" id="opt1"></div>
        <div class="col-md-6"><label class="qc-label">Option 3</label><input class="qc-input" id="opt2"></div>
        <div class="col-md-6"><label class="qc-label">Option 4</label><input class="qc-input" id="opt3"></div>
      </div>
      <div class="field-error mb-2" id="err-options"></div>
      <div class="mb-3">
        <label class="qc-label">Correct Answer</label>
        <select class="qc-input" id="correct_answer_select"></select>
        <div class="field-error" id="err-correct_answer"></div>
      </div>
      <div class="row g-3 mb-4">
        <div class="col-md-6">
          <label class="qc-label">Difficulty</label>
          <select class="qc-input" id="difficulty"><option>Easy</option><option>Medium</option><option>Hard</option></select>
        </div>
        <div class="col-md-6">
          <label class="qc-label">Marks</label>
          <input class="qc-input" id="marks" type="number" min="1" max="100">
          <div class="field-error" id="err-marks"></div>
        </div>
      </div>
      <div class="d-flex gap-2">
        <button class="btn-gradient flex-grow-1" type="submit" id="submit-btn">Update Question</button>
        <a href="/faculty/questions/" class="btn-outline-gradient">Cancel</a>
      </div>
    </form>
  </div>
</section>
{% endblock %}
{% block extra_js %}<script src="{% static 'js/edit_question.js' %}"></script>{% endblock %}
